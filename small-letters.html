<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Small Letters | KDCreativeLab</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#faf9fc;
  color:#34313d;
}

header{
  background:white;
  padding:18px 20px;
  text-align:center;
  border-bottom:1px solid #eee8f5;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  margin:0;
  color:#66578a;
  font-size:28px;
}

header p{
  margin:6px 0 0;
  color:#777;
}

.container{
  max-width:950px;
  margin:auto;
  padding:25px 16px 50px;
}

.letter-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(55px,1fr));
  gap:9px;
  margin-bottom:25px;
}

.letter-btn{
  border:0;
  background:white;
  border:2px solid #e8e0f2;
  border-radius:14px;
  padding:13px 5px;
  font-size:25px;
  font-weight:bold;
  color:#66578a;
  cursor:pointer;
}

.letter-btn.active{
  background:#eee8f8;
  border-color:#9b88bd;
}

.lesson{
  background:white;
  border-radius:25px;
  padding:25px;
  box-shadow:0 5px 20px rgba(80,60,100,.08);
}

.lesson-title{
  text-align:center;
}

.big-letter{
  font-size:100px;
  font-weight:bold;
  color:#66578a;
  line-height:1;
}

.lesson-title h2{
  margin:5px 0;
  font-size:30px;
}

.sound{
  display:inline-block;
  background:#f1ecf8;
  padding:8px 16px;
  border-radius:20px;
  margin-top:8px;
  font-weight:bold;
}

.section{
  margin-top:28px;
}

.section h3{
  color:#66578a;
  border-bottom:2px solid #eee8f5;
  padding-bottom:8px;
}

.pictures{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:12px;
}

.picture-card{
  background:#faf7fd;
  border:1px solid #eee5f6;
  border-radius:18px;
  padding:15px;
  text-align:center;
}

.picture{
  font-size:48px;
}

.picture-card strong{
  display:block;
  margin-top:7px;
}

button{
  font-family:inherit;
}

.action{
  background:#66578a;
  color:white;
  border:0;
  border-radius:12px;
  padding:11px 17px;
  cursor:pointer;
  margin:5px;
  font-size:15px;
}

.secondary{
  background:#eee9f6;
  color:#54476f;
}

.tracing-area{
  display:flex;
  flex-wrap:wrap;
  gap:25px;
  justify-content:center;
}

.trace-box{
  text-align:center;
}

canvas{
  width:260px;
  height:260px;
  border:2px solid #ded5eb;
  border-radius:18px;
  background:#fff;
  touch-action:none;
  cursor:crosshair;
}

.trace-letter{
  font-size:145px;
  color:#e3dced;
  font-weight:bold;
  line-height:260px;
}

.rhyme,.story{
  background:#faf7fd;
  border-radius:16px;
  padding:18px;
  line-height:1.7;
}

.practice{
  background:#f8f5fb;
  border-radius:18px;
  padding:20px;
  margin-top:15px;
}

.options{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:10px;
  margin-top:15px;
}

.option{
  background:white;
  border:2px solid #e4dcef;
  padding:14px;
  border-radius:12px;
  cursor:pointer;
  font-size:16px;
}

.option:hover{
  background:#f0ebf7;
}

.result{
  margin-top:12px;
  font-weight:bold;
  min-height:24px;
}

.answer{
  display:none;
  background:#eee8f7;
  padding:12px;
  border-radius:12px;
  margin-top:12px;
}

.navigation{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:30px;
}

.home{
  text-align:center;
  margin-top:25px;
}

@media(max-width:600px){
  .lesson{
    padding:18px;
  }

  .big-letter{
    font-size:80px;
  }

  canvas{
    width:230px;
    height:230px;
  }

  .trace-letter{
    line-height:230px;
    font-size:125px;
  }
}
</style>
</head>

<body>

<header>
  <h1>KDCreativeLab</h1>
  <p>Small Letters Learning</p>
</header>

<div class="container">

  <div class="letter-grid" id="letterGrid"></div>

  <div class="lesson">

    <div class="lesson-title">
      <div class="big-letter" id="bigLetter">a</div>
      <h2 id="title">Small Letter a</h2>
      <div class="sound" id="sound">Sound: /a/</div>
      <br>
      <button class="action" id="soundBtn">🔊 Listen</button>
    </div>

    <div class="section">
      <h3>🖼️ Look and Learn</h3>
      <div class="pictures" id="pictures"></div>
    </div>

    <div class="section">
      <h3>✍️ Trace the Letter</h3>

      <div class="tracing-area">

        <div class="trace-box">
          <p><strong>Trace small letter</strong></p>
          <canvas id="traceCanvas" width="260" height="260"></canvas>
          <br>
          <button class="action secondary" onclick="clearCanvas()">Clear</button>
        </div>

        <div class="trace-box">
          <p><strong>Practice independently</strong></p>
          <div style="width:260px;height:260px;border:2px solid #ded5eb;border-radius:18px;background:white;">
            <div class="trace-letter" id="guideLetter">a</div>
          </div>
        </div>

      </div>
    </div>

    <div class="section">
      <h3>🎵 Letter Rhyme</h3>
      <div class="rhyme" id="rhyme"></div>
      <button class="action" id="rhymeBtn">🔊 Listen to Rhyme</button>
    </div>

    <div class="section">
      <h3>📖 Short Story</h3>
      <div class="story" id="story"></div>
      <button class="action" id="storyBtn">🔊 Listen to Story</button>
    </div>

    <div class="section">
      <h3>🎯 Practice 1 — Find the Beginning Sound</h3>

      <div class="practice">
        <p id="question1"></p>

        <div class="options" id="options1"></div>

        <div class="result" id="result1"></div>

        <button class="action secondary" id="showAnswer">
          Show Answer
        </button>

        <div class="answer" id="answerBox"></div>
      </div>
    </div>

    <div class="section">
      <h3>🔎 Practice 2 — Find the Letter</h3>

      <div class="practice">
        <p>Which one is the small letter <strong id="questionLetter">a</strong>?</p>

        <div class="options" id="letterOptions"></div>

        <div class="result" id="result2"></div>
      </div>
    </div>

    <div class="navigation">
      <button class="action secondary" id="prevBtn">← Previous</button>
      <button class="action" id="nextBtn">Next →</button>
    </div>

  </div>

  <div class="home">
    <button class="action" onclick="location.href='beginner.html'">
      ← Back to Beginner
    </button>
  </div>

</div>

<script>
