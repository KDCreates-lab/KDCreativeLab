<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Capital Letters | KDCreativeLab</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#EEF6FB;
  color:#1F2933;
}

header{
  background:#173B5C;
  color:white;
  padding:18px 20px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:28px;
}

nav{
  margin-top:12px;
}

nav a{
  color:white;
  text-decoration:none;
  margin:0 8px;
  font-size:14px;
}

.hero{
  text-align:center;
  padding:35px 20px 25px;
  background:white;
}

.hero h2{
  margin:0 0 10px;
  color:#173B5C;
  font-size:32px;
}

.hero p{
  max-width:750px;
  margin:auto;
  line-height:1.6;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 18px;
}

/* LETTER GRID */

.letter-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(70px,1fr));
  gap:12px;
  margin:25px 0 35px;
}

.letter-btn{
  border:none;
  border-radius:14px;
  background:white;
  color:#173B5C;
  font-size:28px;
  font-weight:bold;
  padding:18px 8px;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
  transition:0.2s;
}

.letter-btn:hover{
  transform:translateY(-3px);
}

.letter-btn.active{
  background:#167D7F;
  color:white;
}

/* LESSON */

.lesson{
  background:white;
  border-radius:20px;
  padding:28px;
  box-shadow:0 5px 18px rgba(0,0,0,0.08);
}

.lesson-title{
  text-align:center;
}

.big-letter{
  font-size:90px;
  font-weight:bold;
  color:#173B5C;
  line-height:1;
}

.lesson-title h2{
  margin:10px 0;
  color:#167D7F;
}

.sound-box{
  background:#F6C85F;
  border-radius:16px;
  padding:18px;
  text-align:center;
  margin:25px 0;
}

.sound-box .sound{
  font-size:32px;
  font-weight:bold;
}

.sound-note{
  margin-top:8px;
  font-size:14px;
}

/* VIDEO */

.video-section{
  margin:25px 0;
  padding:20px;
  background:#EEF6FB;
  border-radius:16px;
  text-align:center;
}

.video-section h3{
  color:#173B5C;
}

.video-wrapper{
  position:relative;
  width:100%;
  max-width:760px;
  margin:18px auto;
  aspect-ratio:16/9;
}

.video-wrapper iframe{
  width:100%;
  height:100%;
  border:0;
  border-radius:14px;
}

/* WORDS */

.section{
  margin:30px 0;
}

.section h3{
  color:#173B5C;
  font-size:23px;
}

.picture-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:15px;
}

.word-card{
  background:#EEF6FB;
  border-radius:15px;
  padding:18px 10px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
}

.word-card .emoji{
  display:block;
  font-size:48px;
  margin-bottom:8px;
}

/* TRACING */

.trace-box{
  text-align:center;
}

canvas{
  width:100%;
  max-width:650px;
  height:250px;
  background:#fff;
  border:3px dashed #167D7F;
  border-radius:15px;
  touch-action:none;
}

.trace-letter{
  font-size:110px;
  color:#DDEFE3;
  margin-bottom:-210px;
  position:relative;
  pointer-events:none;
}

.trace-buttons{
  margin-top:15px;
}

button{
  font-family:inherit;
}

.clear-btn,
.practice-btn,
.next-btn{
  border:none;
  background:#167D7F;
  color:white;
  padding:12px 20px;
  border-radius:10px;
  cursor:pointer;
  margin:5px;
  font-size:15px;
}

/* POEM */

.rhyme-box{
  background:#FFF9E8;
  border-left:6px solid #F6C85F;
  padding:20px;
  border-radius:10px;
  line-height:1.8;
  font-size:18px;
}

/* STORY */

.story-box{
  background:#F4FAF5;
  padding:20px;
  border-radius:14px;
  line-height:1.7;
}

/* PRACTICE */

.practice-box{
  background:#EEF6FB;
  padding:20px;
  border-radius:15px;
}

.option{
  display:block;
  width:100%;
  text-align:left;
  background:white;
  border:2px solid #D8E4EA;
  padding:14px;
  margin:8px 0;
  border-radius:10px;
  cursor:pointer;
  font-size:17px;
}

.option:hover{
  border-color:#167D7F;
}

.result{
  font-weight:bold;
  margin-top:12px;
}

/* NAVIGATION */

.lesson-navigation{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:35px;
}

.lesson-navigation button{
  flex:1;
  border:none;
  padding:14px;
  border-radius:10px;
  background:#173B5C;
  color:white;
  cursor:pointer;
  font-size:15px;
}

.back{
  text-align:center;
  margin:30px 0;
}

.back a{
  color:#167D7F;
  font-weight:bold;
  text-decoration:none;
}

footer{
  background:#173B5C;
  color:white;
  text-align:center;
  padding:25px;
  margin-top:30px;
  font-size:14px;
}

/* MOBILE */

@media(max-width:600px){

  header h1{
    font-size:23px;
  }

  nav a{
    display:inline-block;
    margin:5px;
  }

  .hero h2{
    font-size:27px;
  }

  .lesson{
    padding:18px;
  }

  .big-letter{
    font-size:75px;
  }

  .trace-letter{
    font-size:90px;
  }

}

</style>

/* --------------------------------
   CREATE LETTER BUTTONS
-------------------------------- */

const letterGrid = document.getElementById("letterGrid");

const alphabet = Object.keys(letters);

alphabet.forEach(letter => {

  const button = document.createElement("button");

  button.className = "letter-btn";
  button.textContent = letter;

  button.onclick = () => showLesson(letter);

  letterGrid.appendChild(button);

});


/* --------------------------------
   SHOW LESSON
-------------------------------- */

let currentLetter = "A";

function showLesson(letter){

  currentLetter = letter;

  document.querySelectorAll(".letter-btn")
    .forEach(btn => {
      btn.classList.toggle(
        "active",
        btn.textContent === letter
      );
    });

  const data = letters[letter];

  const wordsHTML = data.words.map(word => `
    <div class="word-card">
      <span class="emoji">${word[0]}</span>
      ${word[1]}
    </div>
  `).join("");


  const correctHTML = data.correct.map(word => `
    <button class="option"
      onclick="checkAnswer(this, '${word}', '${letter}')">
      ${word}
    </button>
  `).join("");


  const wrongHTML = data.wrong.slice(0,2).map(word => `
    <button class="option"
      onclick="checkAnswer(this, '${word}', '${letter}')">
      ${word}
    </button>
  `).join("");


  document.getElementById("lesson").innerHTML = `

    <div class="lesson-title">

      <div class="big-letter">
        ${letter}
      </div>

      <h2>Letter ${letter}</h2>

      <p>
        Learn the letter, sound and words that begin with it.
      </p>

    </div>


    <div class="sound-box">

      <div>
        <strong>Phonics Sound</strong>
      </div>

      <div class="sound">
        ${data.sound}
      </div>

      <div class="sound-note">
        This sound should be learned from the Jolly Phonics audio below.
      </div>

    </div>


    <!-- JOLLY PHONICS VIDEO -->

    <div class="video-section">

      <h3>🎵 Jolly Phonics Sound & Song</h3>

      <p>
        Listen to the original Jolly Phonics A–Z resource.
        Say the sound and watch the action.
      </p>

      <div class="video-wrapper">

        <iframe
          src="https://www.youtube.com/embed/wDmDWi-JaAc"
          title="Jolly Phonics letters sound A-Z"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>

      </div>

      <p style="font-size:13px;">
        Original video is hosted on YouTube.
      </p>

    </div>


    <!-- WORDS -->

    <div class="section">

      <h3>🖼️ Words Beginning With ${letter}</h3>

      <p>
        Look at the pictures and say the beginning sound.
      </p>

      <div class="picture-grid">
        ${wordsHTML}
      </div>

    </div>


    <!-- TRACING -->

    <div class="section trace-box">

      <h3>✏️ Trace Letter ${letter}</h3>

      <p>
        Use your finger or mouse to trace the letter.
      </p>

      <div style="position:relative;">

        <div class="trace-letter">
          ${letter}
        </div>

        <canvas id="traceCanvas"
                width="650"
                height="250">
        </canvas>

      </div>

      <div class="trace-buttons">

        <button class="clear-btn"
          onclick="clearCanvas()">
          Clear
        </button>

      </div>

    </div>


    <!-- RHYME -->

    <div class="section">

      <h3>🎶 Jolly Phonics Reminder</h3>

      <div class="rhyme-box">
        ${data.rhyme}
      </div>

      <p style="font-size:14px;">
        Use the original Jolly Phonics song/video above for
        the complete song and action.
      </p>

    </div>


    <!-- STORY -->

    <div class="section">

      <h3>📖 ${letter} Story</h3>

      <div class="story-box">
        ${data.story}
      </div>

    </div>


    <!-- PRACTICE -->

    <div class="section">

      <h3>🔎 Find Words Beginning With ${letter}</h3>

      <div class="practice-box">

        <p>
          Which words begin with the ${letter} sound?
        </p>

        ${correctHTML}
        ${wrongHTML}

        <div class="result" id="result"></div>

      </div>

    </div>


    <!-- NAVIGATION -->

    <div class="lesson-navigation">

      <button onclick="previousLetter()">
        ← Previous
      </button>

      <button onclick="nextLetter()">
        Next →
      </button>

    </div>

  `;


  setupCanvas(letter);

  window.scrollTo({
    top:document.getElementById("lesson").offsetTop - 20,
    behavior:"smooth"
  });

}


/* --------------------------------
   PRACTICE ANSWER
-------------------------------- */

function checkAnswer(button, word, letter){

  const result = document.getElementById("result");

  const data = letters[letter];

  if(data.correct.includes(word)){

    result.textContent =
      "✅ Correct! " + word +
      " begins with the " + letter + " sound.";

    button.style.borderColor = "#167D7F";

  }else{

    result.textContent =
      "❌ Try again. Listen to the sound carefully.";

  }

}


/* --------------------------------
   PREVIOUS / NEXT
-------------------------------- */

function previousLetter(){

  let index = alphabet.indexOf(currentLetter);

  if(index > 0){

    showLesson(
      alphabet[index - 1]
    );

  }

}


function nextLetter(){

  let index = alphabet.indexOf(currentLetter);

  if(index < alphabet.length - 1){

    showLesson(
      alphabet[index + 1]
    );

  }

}


/* --------------------------------
   TRACING CANVAS
-------------------------------- */

let canvas;
let ctx;
let drawing = false;

function setupCanvas(letter){

  canvas = document.getElementById("traceCanvas");

  if(!canvas) return;

  ctx = canvas.getContext("2d");

  ctx.lineWidth = 6;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";


  function getPosition(event){

    const rect = canvas.getBoundingClientRect();

    let clientX;
    let clientY;

    if(event.touches && event.touches.length){

      clientX = event.touches[0].clientX;
      clientY = event.touches[0].clientY;

    }else{

      clientX = event.clientX;
      clientY = event.clientY;

    }

    return {
      x:(clientX - rect.left) *
        (canvas.width / rect.width),

      y:(clientY - rect.top) *
        (canvas.height / rect.height)
    };

  }


  function startDrawing(event){

    drawing = true;

    const pos = getPosition(event);

    ctx.beginPath();

    ctx.moveTo(
      pos.x,
      pos.y
    );

    event.preventDefault();

  }


  function draw(event){

    if(!drawing) return;

    const pos = getPosition(event);

    ctx.lineTo(
      pos.x,
      pos.y
    );

    ctx.stroke();

    event.preventDefault();

  }


  function stopDrawing(){

    drawing = false;

  }


  canvas.onpointerdown = startDrawing;
  canvas.onpointermove = draw;
  canvas.onpointerup = stopDrawing;
  canvas.onpointerleave = stopDrawing;

}


function clearCanvas(){

  if(canvas && ctx){

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

  }

}
